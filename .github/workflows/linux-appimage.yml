name: Linux AppImage

on:
  # Build only as part of a release — invoked by release.yml as a reusable
  # workflow. No push/PR autobuilds.
  workflow_call:

jobs:
  build:
    # Ubuntu 24.04 is the lowest GitHub runner where gcc-15 is reliably
    # available from ppa:ubuntu-toolchain-r/test. The resulting AppImage
    # has a glibc 2.39 baseline.
    name: Build AppImage (Ubuntu 24.04, gcc-15)
    runs-on: ubuntu-24.04

    env:
      BUILD_TYPE: Release
      APPDIR: ${{ github.workspace }}/AppDir
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CC: gcc-15
      CXX: g++-15

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-15 g++-15 \
            cmake ninja-build ccache \
            git wget file patchelf desktop-file-utils \
            zsync

      - name: Install SDL3 + libcurl system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxxf86vm-dev libxfixes-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev libibus-1.0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev \
            libgbm-dev libdrm-dev \
            libcurl4-openssl-dev

      - name: Install Vulkan SDK (LunarG apt repo)
        run: |
          set -eux
          # The LunarG repo provides the Vulkan headers, loader, and
          # glslangValidator that the Real-ESRGAN/ncnn upscaler build needs.
          # Installs into system paths, so find_package(Vulkan) and the
          # glslangValidator lookup resolve without VULKAN_SDK being set.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslangValidator --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-appimage-${{ github.sha }}
          restore-keys: |
            ccache-linux-appimage-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSDL_X11_XTEST=OFF \
            -DWHITEOUT_ENABLE_UPSCALER=ON \
            -DWHITEOUT_BUILD_CLI=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Stage AppDir
        run: |
          set -eux
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/lib" \
                   "${APPDIR}/usr/share/applications" \
                   "${APPDIR}/usr/share/icons/hicolor/256x256/apps" \
                   "${APPDIR}/usr/share/metainfo" \
                   "${APPDIR}/usr/share/WhiteoutTex"

          cp build/WhiteoutTex "${APPDIR}/usr/bin/WhiteoutTex"

          # Real-ESRGAN model weights, next to the binary — SDL_GetBasePath()
          # resolves to the executable's directory on Linux, and the upscaler
          # looks for <basepath>/models. Weights are platform-independent;
          # pulled from the official ncnn-vulkan v0.2.5.0 release.
          models_url="https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
          mtmp="$(mktemp -d)"
          curl -L --fail -o "${mtmp}/models.zip" "${models_url}"
          unzip -q "${mtmp}/models.zip" -d "${mtmp}/extract"
          mkdir -p "${APPDIR}/usr/bin/models"
          find "${mtmp}/extract" -type f \( -name '*.param' -o -name '*.bin' \) \
            -exec cp -v {} "${APPDIR}/usr/bin/models/" \;
          rm -rf "${mtmp}"

          # Localization catalogs (lang/*.ini) and the bundled CJK fonts
          # (fonts/*.ttf), next to the binary where SDL_GetBasePath() resolves
          # them at runtime (mirrors the CMake WhiteoutTexAssets copy).
          cp -av resources/lang  "${APPDIR}/usr/bin/lang"
          cp -av resources/fonts "${APPDIR}/usr/bin/fonts"

          # Built-in node pipelines (pipelines/**, incl. functions/) and their
          # presets (presets/**), next to the binary — the app loads pipelines
          # from ./pipelines and presets from ./presets (mirrors WhiteoutTexAssets).
          cp -av resources/pipelines "${APPDIR}/usr/bin/pipelines"
          cp -av resources/presets   "${APPDIR}/usr/bin/presets"

          # Community CASC listfile, next to the binary as listfile.csv where
          # CascBrowser::loadListfileFromExeDir() reads it via SDL_GetBasePath().
          # Always pull the latest release so new game files resolve.
          curl -L --fail \
            -o "${APPDIR}/usr/bin/listfile.csv" \
            https://github.com/wowdev/wow-listfile/releases/latest/download/community-listfile.csv

          # SDL3 is built in-tree as a shared library; linuxdeploy bundles
          # transitive deps but needs the primary .so available to ldd.
          find build/externals/SDL -maxdepth 2 -name 'libSDL3.so*' \
            -exec cp -av {} "${APPDIR}/usr/lib/" \;

          # Icon — linuxdeploy matches by basename to the .desktop Icon= field.
          cp resources/icon_linux.png "${APPDIR}/whiteouttex.png"
          cp resources/icon_linux.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/whiteouttex.png"

          # Bundled docs (mirrors the existing POST_BUILD copy on Windows).
          cp LICENSE.md LICENSE-AI.md README.md THIRD_PARTY.md \
             "${APPDIR}/usr/share/WhiteoutTex/"

      - name: Generate .desktop entry
        run: |
          cat > "${APPDIR}/whiteouttex.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=WhiteoutTex
          GenericName=Texture Viewer
          Comment=Texture viewer and converter for Blizzard game assets
          Exec=WhiteoutTex
          Icon=whiteouttex
          Terminal=false
          Categories=Graphics;2DGraphics;
          Keywords=BLP;DDS;CASC;MPQ;Texture;Blizzard;
          EOF
          desktop-file-validate "${APPDIR}/whiteouttex.desktop"

      - name: Fetch linuxdeploy
        run: |
          mkdir -p tools && cd tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Build AppImage
        run: |
          set -eux
          export PATH="${{ github.workspace }}/tools:${PATH}"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${LD_LIBRARY_PATH:-}"
          export VERSION="${GITHUB_SHA::8}"

          sdl3_lib="$(find "${APPDIR}/usr/lib" -maxdepth 1 -name 'libSDL3.so*' -not -type l | head -n1)"
          test -n "${sdl3_lib}"

          # FUSE is unavailable on GitHub-hosted runners; the wrapper flag
          # extracts linuxdeploy in place and runs it without mounting.
          linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir "${APPDIR}" \
            --desktop-file "${APPDIR}/whiteouttex.desktop" \
            --icon-file "${APPDIR}/whiteouttex.png" \
            --executable "${APPDIR}/usr/bin/WhiteoutTex" \
            --library "${sdl3_lib}" \
            --output appimage

          # linuxdeploy-plugin-appimage names output "<AppName>-<VERSION>-<arch>.AppImage".
          produced="$(ls WhiteoutTex-*.AppImage | head -n1)"
          echo "ARTIFACT=${produced}" >> "${GITHUB_ENV}"

      - name: Smoke test extracted AppImage
        run: |
          set -eux
          ./"${ARTIFACT}" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/WhiteoutTex
          find squashfs-root -name 'libSDL3.so*' | grep -q .
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: WhiteoutTex-linux-x86_64-AppImage
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
