name: macOS Build

on:
  # Build only as part of a release — invoked by release.yml as a reusable
  # workflow. No push/PR autobuilds.
  workflow_call:

jobs:
  build:
    name: Build .app (macOS arm64)
    runs-on: macos-latest

    env:
      BUILD_TYPE: Release
      # Homebrew installs OpenSSL 3 under /opt/homebrew on Apple Silicon.
      # find_package(OpenSSL) honours this hint to skip the LibreSSL stubs
      # in /usr/lib that have no headers.
      OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Cache the downloaded Homebrew bottles (incl. the Vulkan/MoltenVK
      # formulae) so repeat runs skip re-fetching them.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-${{ runner.os }}-${{ runner.arch }}-vulkan-v1
          restore-keys: |
            brew-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies via Homebrew
        run: |
          brew update --quiet
          # coreutils provides gtimeout, used to bound dylibbundler so it
          # can't infinite-loop the runner on an unresolved dependency.
          # vulkan-headers/loader + molten-vk + glslang supply everything the
          # Real-ESRGAN/ncnn upscaler needs to build (Vulkan via MoltenVK).
          brew install ninja openssl@3 dylibbundler coreutils \
            vulkan-headers vulkan-loader molten-vk glslang
          # Point FindVulkan + the glslangValidator lookup at the Homebrew
          # prefix ($PREFIX/include, $PREFIX/lib, $PREFIX/bin).
          echo "VULKAN_SDK=$(brew --prefix)" >> "${GITHUB_ENV}"

      - name: Generate AppIcon.icns from resources/Icon.png
        run: |
          set -eux
          SRC=resources/Icon.png
          ICONSET=AppIcon.iconset
          mkdir -p "${ICONSET}"
          sips -z 16   16   "${SRC}" --out "${ICONSET}/icon_16x16.png"
          sips -z 32   32   "${SRC}" --out "${ICONSET}/icon_16x16@2x.png"
          sips -z 32   32   "${SRC}" --out "${ICONSET}/icon_32x32.png"
          sips -z 64   64   "${SRC}" --out "${ICONSET}/icon_32x32@2x.png"
          sips -z 128  128  "${SRC}" --out "${ICONSET}/icon_128x128.png"
          sips -z 256  256  "${SRC}" --out "${ICONSET}/icon_128x128@2x.png"
          sips -z 256  256  "${SRC}" --out "${ICONSET}/icon_256x256.png"
          sips -z 512  512  "${SRC}" --out "${ICONSET}/icon_256x256@2x.png"
          sips -z 512  512  "${SRC}" --out "${ICONSET}/icon_512x512.png"
          cp "${SRC}" "${ICONSET}/icon_512x512@2x.png"
          iconutil --convert icns "${ICONSET}" --output resources/AppIcon.icns
          rm -rf "${ICONSET}"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSDL_X11_XTEST=OFF \
            -DWHITEOUT_ENABLE_UPSCALER=ON \
            -DWHITEOUT_BUILD_CLI=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Bundle dylibs into .app
        run: |
          set -eux
          APP="build/WhiteoutTex.app"
          test -d "${APP}/Contents/MacOS"

          # Discover where SDL3's dylib(s) actually landed.  The exact
          # filename (libSDL3.0.dylib vs libSDL3.0.3.0.dylib vs …) and the
          # build subdirectory both vary across SDL versions and generators,
          # so don't hard-code — find the first match and use its dir.
          sdl_dylib="$(find build/externals/SDL -name 'libSDL3*.dylib' \
                       -not -type l | head -n1)"
          test -n "${sdl_dylib}"
          sdl_lib_dir="$(dirname "${sdl_dylib}")"
          echo "SDL dylib dir: ${sdl_lib_dir}"
          ls -la "${sdl_lib_dir}"/libSDL3* || true

          # dylibbundler rewrites LC_LOAD_DYLIB entries to point at the
          # @executable_path-relative Frameworks/ dir and copies every
          # non-system dylib in.  -od overwrites existing copies; -of
          # overwrites existing files; -cd creates the dest dir; -b is
          # "bundle" mode (default).  -p sets the rewritten install_name
          # prefix.
          # -s search paths are MANDATORY for libs whose install_name is
          # @rpath/... (SDL3) or that live in non-standard prefixes
          # (Homebrew OpenSSL).  If anything goes unresolved dylibbundler
          # enters an infinite stdin-prompt loop with no escape flag —
          # the `timeout` is a hard backstop so the runner doesn't burn
          # the full 6-hour job budget logging "Please specify ...".
          mkdir -p "${APP}/Contents/Frameworks"
          gtimeout 300 dylibbundler -od -b -of -cd \
            -x "${APP}/Contents/MacOS/WhiteoutTex" \
            -d "${APP}/Contents/Frameworks/" \
            -p "@executable_path/../Frameworks/" \
            -s "/opt/homebrew/opt/openssl@3/lib" \
            -s "$(brew --prefix)/lib" \
            -s "${sdl_lib_dir}"

      - name: Bundle models + MoltenVK into .app
        run: |
          set -eux
          APP="build/WhiteoutTex.app"

          # Real-ESRGAN model weights. On macOS bundles SDL_GetBasePath()
          # returns Contents/Resources/, so the upscaler looks there for models/.
          # Weights are platform-independent; pulled from the official
          # ncnn-vulkan v0.2.5.0 release.
          models_url="https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
          mtmp="$(mktemp -d)"
          curl -L --fail -o "${mtmp}/models.zip" "${models_url}"
          unzip -q "${mtmp}/models.zip" -d "${mtmp}/extract"
          mkdir -p "${APP}/Contents/Resources/models"
          find "${mtmp}/extract" -type f \( -name '*.param' -o -name '*.bin' \) \
            -exec cp -v {} "${APP}/Contents/Resources/models/" \;
          rm -rf "${mtmp}"

          # Localization catalogs (lang/*.ini) and the bundled CJK fonts
          # (fonts/*.ttf). On macOS bundles SDL_GetBasePath() returns
          # Contents/Resources/, so the app loads lang/ and fonts/ from there
          # (mirrors the CMake WhiteoutTexAssets copy). Staged before codesign
          # so the signature covers them.
          cp -Rv resources/lang  "${APP}/Contents/Resources/lang"
          cp -Rv resources/fonts "${APP}/Contents/Resources/fonts"

          # Built-in node pipelines (pipelines/**, incl. functions/) and their
          # presets (presets/**), loaded from Contents/Resources/ via
          # SDL_GetBasePath() (mirrors the CMake WhiteoutTexAssets copy).
          cp -Rv resources/pipelines "${APP}/Contents/Resources/pipelines"
          cp -Rv resources/presets   "${APP}/Contents/Resources/presets"

          # Community CASC listfile as listfile.csv where
          # CascBrowser::loadListfileFromExeDir() reads it via SDL_GetBasePath()
          # (Contents/Resources/ for a macOS bundle). Always pull the latest
          # release so new game files resolve. Staged before codesign so the
          # signature covers it.
          curl -L --fail \
            -o "${APP}/Contents/Resources/listfile.csv" \
            https://github.com/wowdev/wow-listfile/releases/latest/download/community-listfile.csv

          # Vulkan on macOS is provided by MoltenVK. The loader (libvulkan,
          # bundled by dylibbundler since the binary links it) discovers an ICD
          # via the bundle's Resources/vulkan/icd.d directory, so ship MoltenVK
          # plus an ICD manifest whose library_path is bundle-relative.
          FW="${APP}/Contents/Frameworks"
          ICD="${APP}/Contents/Resources/vulkan/icd.d"
          mkdir -p "${FW}" "${ICD}"
          cp "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" "${FW}/"
          cat > "${ICD}/MoltenVK_icd.json" <<'EOF'
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "../../../Frameworks/libMoltenVK.dylib",
                  "api_version": "1.2.0"
              }
          }
          EOF

      - name: Ad-hoc codesign
        run: |
          # No Developer ID — ad-hoc signature lets the bundle launch via
          # right-click → Open.  Real distribution would notarize separately.
          # Run AFTER models/MoltenVK are staged so they are covered by the
          # signature (adding files post-sign would invalidate it).
          codesign --force --deep --sign - --timestamp=none build/WhiteoutTex.app
          codesign --verify --deep --strict --verbose=2 build/WhiteoutTex.app

      - name: Smoke test bundle launch
        run: |
          set -eux
          # Verify the executable resolves all its dylibs.  We can't
          # actually run the GUI on a headless runner; just confirm no
          # absolute build-tree paths leaked into the load commands.
          # `tail -n +2` skips otool's first line, which is the filename
          # header (e.g. "build/.../WhiteoutTex:") and would falsely
          # match `build/`.
          otool -L build/WhiteoutTex.app/Contents/MacOS/WhiteoutTex
          if otool -L build/WhiteoutTex.app/Contents/MacOS/WhiteoutTex \
               | tail -n +2 \
               | grep -qE "(/Users/|/runner/|build/)"; then
            echo "ERROR: bundle still references absolute build paths"
            exit 1
          fi

      - name: Create .dmg
        run: |
          set -eux
          # Final asset name: WhiteoutTex-<sha8>-<os>-<arch>.<ext> (matches the
          # Windows zip / Linux AppImage naming so release assets sort together).
          DMG="WhiteoutTex-${GITHUB_SHA::8}-macos-arm64.dmg"
          STAGE=dmg-staging
          rm -rf "${STAGE}" "${DMG}"
          mkdir "${STAGE}"
          cp -R build/WhiteoutTex.app "${STAGE}/"
          ln -s /Applications "${STAGE}/Applications"
          hdiutil create -volname "WhiteoutTex" \
            -srcfolder "${STAGE}" \
            -ov -format UDZO \
            "${DMG}"
          echo "ARTIFACT=${DMG}" >> "${GITHUB_ENV}"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: WhiteoutTex-macos-arm64-dmg
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 30
