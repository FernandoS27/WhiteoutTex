pipeline.node.fill_channel.desc=Задаёт выбранному каналу изображения фиксированное значение.
pipeline.node.invert.desc=Инвертирует одиночный канал (1 - значение).
pipeline.node.merge_channels.desc=Объединяет до четырёх одиночных каналов в изображение RGBA.
pipeline.node.prims.desc=Разворачивает одиночный канал в полутоновое изображение RGBA.
pipeline.node.luma.desc=Вычисляет яркость (полутон) изображения по выбранным весам.
pipeline.node.add.desc=Поэлементно складывает два значения (числа или каналы).
pipeline.node.multiply.desc=Поэлементно перемножает два значения (числа или каналы).
pipeline.node.min.desc=Поэлементный минимум двух значений.
pipeline.node.max.desc=Поэлементный максимум двух значений.
pipeline.node.negate.desc=Меняет знак значения (-x).
pipeline.node.sqrt.desc=Квадратный корень значения.
pipeline.node.reciprocal.desc=Обратное значение (1 / x).
pipeline.node.power.desc=Возводит основание в степень (основание ^ показатель).
pipeline.node.to_int.desc=Преобразует вещественное число в целое с использованием выбранного режима округления.
pipeline.node.to_real.desc=Преобразует целое число в вещественное.
pipeline.node.sine.desc=Синус значения в радианах (поэлементно для канала).
pipeline.node.cosine.desc=Косинус значения в радианах (поэлементно для канала).
pipeline.node.ln.desc=Натуральный логарифм (по основанию e); неположительные значения дают 0.
pipeline.node.bit_and.desc=Побитовое И двух целых чисел.
pipeline.node.bit_or.desc=Побитовое ИЛИ двух целых чисел.
pipeline.node.bit_xor.desc=Побитовое исключающее ИЛИ двух целых чисел.
pipeline.node.bit_not.desc=Побитовое НЕ (дополнение) целого числа.
pipeline.node.bit_shl.desc=Сдвигает биты целого числа влево на заданное количество.
pipeline.node.bit_shr.desc=Сдвигает биты целого числа вправо на заданное количество.
pipeline.node.gaussian_blur.desc=Размывает изображение ядром Gaussian заданного радиуса.
pipeline.node.sharpen.desc=Повышает резкость изображения с заданной силой.
pipeline.node.sobel.desc=Обнаружение границ методом Sobel на одиночном канале.
pipeline.node.derivatives.desc=Вычисляет градиенты (производные) канала по X и Y.
pipeline.node.blend.desc=Накладывает верхний слой на нижний с выбранным режимом смешивания.
pipeline.node.mirror.desc=Отражает изображение или канал по горизонтали (X) или вертикали (Y).
pipeline.node.rotate.desc=Поворачивает изображение или канал на заданное число градусов.
pipeline.node.scale_to.desc=Передискретизирует изображение или канал до точной ширины и высоты.
pipeline.node.scale_by.desc=Передискретизирует изображение или канал с коэффициентом масштаба (1.0 = без изменений).
pipeline.node.displace.desc=Смещает изображение или канал по осям X и Y; края заворачиваются, зажимаются или очищаются.
pipeline.node.resize_canvas.desc=Изменяет размер холста, сохраняя источник по центру (дополняет или обрезает, без передискретизации).
pipeline.node.tiling.desc=Делает изображение или канал бесшовно повторяющимся, смешивая его края.
pipeline.node.matching_mipmap.desc=Находит mip-уровень одного изображения, наиболее соответствующий другому.
pipeline.node.extract_mipmap.desc=Извлекает один mip-уровень из изображения.
pipeline.node.downscale.desc=Уменьшает разрешение изображения вдвое или вчетверо.
pipeline.node.upscale.desc=Увеличивает изображение с помощью модели AI (выполняется вне конвейера).
pipeline.node.regenerate_mipmaps.desc=Перестраивает цепочку mipmap-уровней изображения.
pipeline.node.image_properties.desc=Сообщает ширину, высоту, число mip-уровней, вид и подвиды каналов изображения.
pipeline.node.set_kind.desc=Помечает изображение семантическим видом текстуры.
pipeline.node.conditional.desc=Направляет значение на выход «истина» или «ложь» по результату сравнения двух чисел.
pipeline.node.select.desc=Выдаёт одно из двух значений по результату сравнения двух чисел (тернарный оператор).
pipeline.node.rendezvous.desc=Объединяет две ветви: выдаёт тот вход, который несёт значение.
pipeline.node.subpipeline.desc=Запускает другой сохранённый конвейер как шаг; его пины повторяют порты этого конвейера.
pipeline.node.local_call.desc=Запускает кадр локального конвейера из этого графа; его пины повторяют порты кадра.
pipeline.node.frame_local.desc=Контейнер; узлы внутри него образуют локальный конвейер, вызываемый из этого графа.
pipeline.node.standard_output.desc=Основное выходное изображение конвейера (результат).
pipeline.node.real_output.desc=Именованный вещественный выход (для конвейеров-функций).
pipeline.node.integer_output.desc=Именованный целочисленный выход (для конвейеров-функций).
pipeline.node.channel_output.desc=Именованный одноканальный выход (для конвейеров-функций).
pipeline.node.numeric_output.desc=Именованный полиморфный числовой выход (для конвейеров-функций).
pipeline.function=Функция
pipeline.multilingual=Многоязычный
pipeline.i18n.ports=Подписи портов
batch.pipeline=Конвейер
batch.no_pipelines=Стандартные конвейеры не найдены
pipeline.debug=Отладка
pipeline.clear=Очистить холст
pipeline.clear_yes=Очистить
pipeline.clear_confirm=Очистить весь холст? Это действие нельзя отменить.
debug.inputs=Входы
debug.results=Результаты
debug.no_outputs=У этого конвейера нет выходов.
debug.no_value=(нет значения)
