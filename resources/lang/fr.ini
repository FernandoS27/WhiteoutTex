# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=L'image d'entrée principale du pipeline (la texture sur laquelle il s'exécute).
pipeline.node.real_input.desc=Un paramètre à nombre réel fourni à l'exécution du pipeline (plage de limitation facultative).
pipeline.node.integer_input.desc=Un paramètre entier fourni à l'exécution du pipeline (plage de limitation facultative).
pipeline.node.channel_input.desc=Une entrée à canal unique fournie lorsque le pipeline est appelé comme fonction.
pipeline.node.numeric_input.desc=Une entrée numérique polymorphe (réel, entier ou canal) fournie à l'exécution.
pipeline.node.resource.desc=Charge une image prédéfinie incluse depuis le dossier resources.
pipeline.node.const_int.desc=Produit une valeur entière fixe.
pipeline.node.const_real.desc=Produit une valeur réelle (décimale) fixe.
pipeline.node.const_channel.desc=Génère un canal unique d'une largeur et d'une hauteur données rempli d'une valeur.
pipeline.node.const_kind.desc=Produit un type de texture choisi sous forme d'entier.
pipeline.node.extract_channel.desc=Extrait un canal (R, G, B ou A) d'une image.
pipeline.node.invert_channel.desc=Inverse le canal sélectionné d'une image.
pipeline.node.fill_channel.desc=Définit le canal sélectionné d'une image à une valeur fixe.
pipeline.node.invert.desc=Inverse un canal unique (1 - valeur).
pipeline.node.merge_channels.desc=Combine jusqu'à quatre canaux uniques en une image RGBA.
pipeline.node.prims.desc=Étend un canal unique en une image RGBA en niveaux de gris.
pipeline.node.luma.desc=Calcule la luminance (niveaux de gris) d'une image selon la pondération choisie.
pipeline.node.add.desc=Additionne deux valeurs élément par élément (nombres ou canaux).
pipeline.node.multiply.desc=Multiplie deux valeurs élément par élément (nombres ou canaux).
pipeline.node.min.desc=Minimum élément par élément de deux valeurs.
pipeline.node.max.desc=Maximum élément par élément de deux valeurs.
pipeline.node.negate.desc=Négation d'une valeur (-x).
pipeline.node.sqrt.desc=Racine carrée d'une valeur.
pipeline.node.reciprocal.desc=Inverse d'une valeur (1 / x).
pipeline.node.power.desc=Élève une base à un exposant (base ^ exposant).
pipeline.node.to_int.desc=Convertit un réel en entier en utilisant le mode d'arrondi choisi.
pipeline.node.to_real.desc=Convertit un entier en réel.
pipeline.node.sine.desc=Sinus d'une valeur en radians (par élément pour un canal).
pipeline.node.cosine.desc=Cosinus d'une valeur en radians (par élément pour un canal).
pipeline.node.ln.desc=Logarithme népérien (base e) ; les valeurs non positives donnent 0.
pipeline.node.bit_and.desc=ET bit à bit de deux entiers.
pipeline.node.bit_or.desc=OU bit à bit de deux entiers.
pipeline.node.bit_xor.desc=OU exclusif bit à bit de deux entiers.
pipeline.node.bit_not.desc=NON bit à bit (complément) d'un entier.
pipeline.node.bit_shl.desc=Décale les bits d'un entier vers la gauche d'un certain nombre.
pipeline.node.bit_shr.desc=Décale les bits d'un entier vers la droite d'un certain nombre.
pipeline.node.gaussian_blur.desc=Floute une image avec un noyau Gaussian du rayon donné.
pipeline.node.sharpen.desc=Accentue une image selon l'intensité donnée.
pipeline.node.sobel.desc=Détection de contours Sobel sur un canal unique.
pipeline.node.derivatives.desc=Calcule les gradients (dérivées) X et Y d'un canal.
pipeline.node.blend.desc=Compose un calque supérieur sur un calque inférieur selon le mode de mélange choisi.
pipeline.node.mirror.desc=Retourne une image ou un canal horizontalement (X) ou verticalement (Y).
pipeline.node.rotate.desc=Pivote une image ou un canal d'un certain nombre de degrés.
pipeline.node.scale_to.desc=Rééchantillonne une image ou un canal vers une largeur et une hauteur exactes.
pipeline.node.scale_by.desc=Rééchantillonne une image ou un canal selon un facteur d'échelle (1.0 = inchangé).
pipeline.node.displace.desc=Décale une image ou un canal selon des décalages X et Y ; les bords bouclent, s'étendent ou s'effacent.
pipeline.node.resize_canvas.desc=Modifie la taille du canevas en gardant la source centrée (remplit ou rogne, sans rééchantillonnage).
pipeline.node.tiling.desc=Rend une image ou un canal pavable de façon transparente en fondant ses bords.
pipeline.node.matching_mipmap.desc=Trouve le niveau de mip d'une image qui correspond le mieux à une autre.
pipeline.node.extract_mipmap.desc=Extrait un seul niveau de mip d'une image.
pipeline.node.downscale.desc=Réduit la résolution d'une image de moitié ou au quart.
pipeline.node.upscale.desc=Agrandit une image avec un modèle AI (exécuté hors du pipeline).
pipeline.node.regenerate_mipmaps.desc=Reconstruit la chaîne de mipmaps d'une image.
pipeline.node.image_properties.desc=Indique la largeur, la hauteur, le nombre de mips, le type et les sous-types de canaux d'une image.
pipeline.node.set_kind.desc=Marque une image avec un type de texture sémantique.
pipeline.node.conditional.desc=Achemine une valeur vers sa sortie vrai ou faux selon la comparaison de deux nombres.
pipeline.node.select.desc=Produit l'une de deux valeurs selon la comparaison de deux nombres (un ternaire).
pipeline.node.rendezvous.desc=Joint deux branches : produit l'entrée qui porte une valeur.
