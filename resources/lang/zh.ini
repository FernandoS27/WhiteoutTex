# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=流水线的主输入图像（运行所针对的纹理）。
pipeline.node.real_input.desc=流水线运行时提供的实数参数（可选限制范围）。
pipeline.node.integer_input.desc=流水线运行时提供的整数参数（可选限制范围）。
pipeline.node.channel_input.desc=流水线作为函数调用时提供的单通道输入。
pipeline.node.numeric_input.desc=运行时提供的多态数值输入（实数、整数或通道）。
pipeline.node.resource.desc=从 resources 文件夹加载内置的预设图像。
pipeline.node.const_int.desc=输出固定的整数值。
pipeline.node.const_real.desc=输出固定的实数（小数）值。
pipeline.node.const_channel.desc=生成指定宽高并以某一值填充的单通道。
pipeline.node.const_kind.desc=将选定的纹理种类作为整数输出。
pipeline.node.extract_channel.desc=从图像中提取某一通道（R、G、B 或 A）。
pipeline.node.invert_channel.desc=反转图像中选定的通道。
pipeline.node.fill_channel.desc=将图像中选定的通道设为固定值。
pipeline.node.invert.desc=反转单个通道（1 - 值）。
pipeline.node.merge_channels.desc=将最多四个单通道合并为 RGBA 图像。
pipeline.node.prims.desc=将单个通道扩展为灰度 RGBA 图像。
pipeline.node.luma.desc=使用选定的权重从图像计算亮度（灰度）。
pipeline.node.add.desc=按元素将两个值相加（数值或通道）。
pipeline.node.multiply.desc=按元素将两个值相乘（数值或通道）。
pipeline.node.min.desc=两个值的逐元素最小值。
pipeline.node.max.desc=两个值的逐元素最大值。
pipeline.node.negate.desc=对值取负（-x）。
pipeline.node.sqrt.desc=值的平方根。
pipeline.node.reciprocal.desc=值的倒数（1 / x）。
pipeline.node.power.desc=将底数求幂（底数 ^ 指数）。
pipeline.node.sine.desc=以弧度为单位的值的正弦（对通道按元素计算）。
pipeline.node.cosine.desc=以弧度为单位的值的余弦（对通道按元素计算）。
pipeline.node.ln.desc=自然对数（以 e 为底）；非正值返回 0。
pipeline.node.bit_and.desc=两个整数的按位 AND。
pipeline.node.bit_or.desc=两个整数的按位 OR。
pipeline.node.bit_xor.desc=两个整数的按位 XOR。
pipeline.node.bit_not.desc=整数的按位 NOT（取补）。
pipeline.node.bit_shl.desc=将整数的位向左移动指定位数。
pipeline.node.bit_shr.desc=将整数的位向右移动指定位数。
pipeline.node.gaussian_blur.desc=使用指定半径的 Gaussian 核对图像进行模糊。
pipeline.node.sharpen.desc=按指定强度锐化图像。
pipeline.node.sobel.desc=对单个通道进行 Sobel 边缘检测。
pipeline.node.derivatives.desc=计算通道的 X 和 Y 梯度（导数）。
pipeline.node.blend.desc=使用选定的混合模式将顶层合成到底层之上。
pipeline.node.mirror.desc=将图像或通道水平（X）或垂直（Y）翻转。
pipeline.node.rotate.desc=将图像或通道旋转指定的度数。
pipeline.node.scale_to.desc=将图像或通道重采样为精确的宽度和高度。
pipeline.node.scale_by.desc=按缩放系数重采样图像或通道（1.0 = 不变）。
pipeline.node.displace.desc=按 X 和 Y 偏移量移动图像或通道；边缘可环绕、钳制或清除。
pipeline.node.resize_canvas.desc=调整画布大小，并使源内容保持居中（填充或裁剪，不重采样）。
pipeline.node.tiling.desc=通过混合边缘使图像或通道可无缝平铺。
pipeline.node.matching_mipmap.desc=查找一张图像中与另一张最匹配的 mip 层级。
pipeline.node.extract_mipmap.desc=从图像中提取单个 mip 层级。
pipeline.node.downscale.desc=将图像分辨率减半或减至四分之一。
pipeline.node.upscale.desc=使用 AI 模型放大图像（在流水线之外运行）。
pipeline.node.regenerate_mipmaps.desc=重建图像的 mipmap 链。
pipeline.node.image_properties.desc=报告图像的宽度、高度、mip 数量、种类及通道子种类。
pipeline.node.set_kind.desc=为图像标记语义化的纹理种类。
