# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=管線的主要輸入影像（執行所針對的紋理）。
pipeline.node.real_input.desc=管線執行時提供的實數參數（可選的限制範圍）。
pipeline.node.integer_input.desc=管線執行時提供的整數參數（可選的限制範圍）。
pipeline.node.channel_input.desc=當管線以函式呼叫時提供的單一通道輸入。
pipeline.node.numeric_input.desc=執行時提供的多型數值輸入（實數、整數或通道）。
pipeline.node.resource.desc=從 resources 資料夾載入內建的預設影像。
pipeline.node.const_int.desc=輸出固定的整數值。
pipeline.node.const_real.desc=輸出固定的實數（小數）值。
pipeline.node.const_channel.desc=產生指定寬度與高度、以某值填滿的單一通道。
pipeline.node.const_kind.desc=以整數形式輸出所選的紋理種類。
pipeline.node.extract_channel.desc=從影像中擷取一個通道（R、G、B 或 A）。
pipeline.node.invert_channel.desc=反轉影像中所選的通道。
pipeline.node.fill_channel.desc=將影像中所選的通道設為固定值。
pipeline.node.invert.desc=反轉單一通道（1 - 值）。
pipeline.node.merge_channels.desc=將最多四個單一通道合併為 RGBA 影像。
pipeline.node.prims.desc=將單一通道展開為灰階 RGBA 影像。
pipeline.node.luma.desc=使用所選的權重從影像計算亮度（灰階）。
pipeline.node.add.desc=將兩個值逐元素相加（數字或通道）。
pipeline.node.multiply.desc=將兩個值逐元素相乘（數字或通道）。
pipeline.node.min.desc=兩個值的逐元素最小值。
pipeline.node.max.desc=兩個值的逐元素最大值。
pipeline.node.negate.desc=對值取負（-x）。
pipeline.node.sqrt.desc=值的平方根。
pipeline.node.reciprocal.desc=值的倒數（1 / x）。
pipeline.node.power.desc=將底數提升至指數次方（底數 ^ 指數）。
pipeline.node.to_int.desc=使用所選的取整模式將實數轉換為整數。
pipeline.node.to_real.desc=將整數轉換為實數。
pipeline.node.sine.desc=以弧度計算值的正弦（通道時逐元素計算）。
pipeline.node.cosine.desc=以弧度計算值的餘弦（通道時逐元素計算）。
pipeline.node.ln.desc=自然對數（以 e 為底）；非正值會得到 0。
pipeline.node.bit_and.desc=兩個整數的 Bitwise AND。
pipeline.node.bit_or.desc=兩個整數的 Bitwise OR。
pipeline.node.bit_xor.desc=兩個整數的 Bitwise XOR。
pipeline.node.bit_not.desc=整數的 Bitwise NOT（補數）。
pipeline.node.bit_shl.desc=將整數的位元左移指定的位數。
pipeline.node.bit_shr.desc=將整數的位元右移指定的位數。
pipeline.node.gaussian_blur.desc=以指定半徑的 Gaussian 核心模糊影像。
pipeline.node.sharpen.desc=以指定的強度銳化影像。
pipeline.node.sobel.desc=對單一通道進行 Sobel 邊緣偵測。
pipeline.node.derivatives.desc=計算通道的 X 與 Y 梯度（導數）。
pipeline.node.blend.desc=使用所選的混合模式將上層合成於下層之上。
pipeline.node.mirror.desc=水平（X）或垂直（Y）翻轉影像或通道。
pipeline.node.rotate.desc=將影像或通道旋轉指定的度數。
pipeline.node.scale_to.desc=將影像或通道重新取樣至精確的寬度與高度。
pipeline.node.scale_by.desc=依比例係數重新取樣影像或通道（1.0 = 不變）。
pipeline.node.displace.desc=依 X 與 Y 位移量移動影像或通道；邊緣可環繞、鉗制或清除。
pipeline.node.resize_canvas.desc=調整畫布尺寸，並使來源保持置中（填充或裁切，不重新取樣）。
pipeline.node.tiling.desc=透過混合邊界，使影像或通道可無縫平鋪。
pipeline.node.matching_mipmap.desc=尋找某影像中最符合另一影像的 mip 層級。
pipeline.node.extract_mipmap.desc=從影像中擷取單一 mip 層級。
pipeline.node.downscale.desc=將影像解析度縮為一半或四分之一。
pipeline.node.upscale.desc=使用 AI 模型放大影像（於管線外執行）。
pipeline.node.regenerate_mipmaps.desc=重建影像的 mipmap 鏈。
pipeline.node.image_properties.desc=回報影像的寬度、高度、mip 數量、種類與通道子種類。
pipeline.node.set_kind.desc=為影像標記語意化的紋理種類。
pipeline.node.conditional.desc=依據比較兩個數字的結果，將值導向其 true 或 false 輸出。
pipeline.node.select.desc=依據比較兩個數字的結果，輸出兩個值之一（三元運算）。
pipeline.node.rendezvous.desc=匯合兩個分支：輸出帶有值的那個輸入。
pipeline.node.subpipeline.desc=將另一個已儲存的管線作為步驟執行；其接腳對應該管線的連接埠。
pipeline.node.local_call.desc=從此圖執行一個本機管線框架；其接腳對應該框架的連接埠。
pipeline.node.frame_local.desc=一個容器；放入其中的節點構成可從此圖呼叫的本機管線。
pipeline.node.standard_output.desc=管線的主要輸出影像（結果）。
pipeline.node.real_output.desc=具名的實數輸出（用於函式管線）。
pipeline.node.integer_output.desc=具名的整數輸出（用於函式管線）。
pipeline.node.channel_output.desc=具名的單一通道輸出（用於函式管線）。
pipeline.node.numeric_output.desc=具名的多型數值輸出（用於函式管線）。
