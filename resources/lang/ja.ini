# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=パイプラインのメイン入力画像（処理対象のテクスチャ）。
pipeline.node.real_input.desc=パイプライン実行時に与えられる実数パラメーター（クランプ範囲は任意）。
pipeline.node.integer_input.desc=パイプライン実行時に与えられる整数パラメーター（クランプ範囲は任意）。
pipeline.node.channel_input.desc=パイプラインを関数として呼び出す際に与えられる単一チャンネル入力。
pipeline.node.numeric_input.desc=実行時に与えられる多態的な数値入力（実数、整数、またはチャンネル）。
pipeline.node.resource.desc=resources フォルダーから同梱のプリセット画像を読み込みます。
pipeline.node.const_int.desc=固定の整数値を出力します。
pipeline.node.const_real.desc=固定の実数（小数）値を出力します。
pipeline.node.const_channel.desc=指定した幅と高さの単一チャンネルを生成し、値で塗りつぶします。
pipeline.node.const_kind.desc=選択したテクスチャ種別を整数として出力します。
pipeline.node.extract_channel.desc=画像から 1 つのチャンネル（R、G、B、または A）を抽出します。
pipeline.node.invert_channel.desc=画像の選択したチャンネルを反転します。
pipeline.node.fill_channel.desc=画像の選択したチャンネルを固定値に設定します。
pipeline.node.invert.desc=単一チャンネルを反転します（1 - 値）。
pipeline.node.merge_channels.desc=最大 4 つの単一チャンネルを RGBA 画像に統合します。
pipeline.node.prims.desc=単一チャンネルをグレースケールの RGBA 画像に展開します。
pipeline.node.luma.desc=選択した重み付けを用いて画像から輝度（グレースケール）を計算します。
pipeline.node.add.desc=2 つの値を要素ごとに加算します（数値またはチャンネル）。
pipeline.node.multiply.desc=2 つの値を要素ごとに乗算します（数値またはチャンネル）。
pipeline.node.min.desc=2 つの値の要素ごとの最小値。
pipeline.node.max.desc=2 つの値の要素ごとの最大値。
pipeline.node.negate.desc=値の符号を反転します（-x）。
pipeline.node.sqrt.desc=値の平方根。
pipeline.node.reciprocal.desc=値の逆数（1 / x）。
pipeline.node.power.desc=底を指数でべき乗します（底 ^ 指数）。
pipeline.node.to_int.desc=選択した丸めモードを使用して実数を整数へ変換します。
pipeline.node.to_real.desc=整数を実数へ変換します。
pipeline.node.sine.desc=ラジアン単位の値の正弦（チャンネルの場合は要素ごと）。
pipeline.node.cosine.desc=ラジアン単位の値の余弦（チャンネルの場合は要素ごと）。
pipeline.node.ln.desc=自然対数（底 e）。0 以下の値は 0 になります。
pipeline.node.bit_and.desc=2 つの整数のビットごとの AND。
pipeline.node.bit_or.desc=2 つの整数のビットごとの OR。
pipeline.node.bit_xor.desc=2 つの整数のビットごとの XOR。
pipeline.node.bit_not.desc=整数のビットごとの NOT（補数）。
pipeline.node.bit_shl.desc=整数のビットを指定した分だけ左へシフトします。
pipeline.node.bit_shr.desc=整数のビットを指定した分だけ右へシフトします。
pipeline.node.gaussian_blur.desc=指定した半径の Gaussian カーネルで画像をぼかします。
pipeline.node.sharpen.desc=指定した強さで画像をシャープにします。
pipeline.node.sobel.desc=単一チャンネルに対する Sobel エッジ検出。
pipeline.node.derivatives.desc=チャンネルの X および Y 勾配（微分）を計算します。
pipeline.node.blend.desc=選択したブレンドモードで上のレイヤーを下のレイヤーに合成します。
pipeline.node.mirror.desc=画像またはチャンネルを水平（X）または垂直（Y）に反転します。
pipeline.node.rotate.desc=画像またはチャンネルを指定した度数だけ回転します。
pipeline.node.scale_to.desc=画像またはチャンネルを指定した正確な幅と高さに再サンプリングします。
pipeline.node.scale_by.desc=画像またはチャンネルを倍率で再サンプリングします（1.0 = 変更なし）。
pipeline.node.displace.desc=画像またはチャンネルを X および Y のオフセットだけずらします。端はラップ、クランプ、またはクリアされます。
pipeline.node.resize_canvas.desc=キャンバスのサイズを変更し、ソースを中央に保ちます（パディングまたはクロップを行い、再サンプリングはしません）。
pipeline.node.tiling.desc=境界をブレンドして、画像またはチャンネルをシームレスにタイル化できるようにします。
pipeline.node.matching_mipmap.desc=ある画像の中で別の画像に最もよく一致する mip レベルを探します。
pipeline.node.extract_mipmap.desc=画像から単一の mip レベルを抽出します。
pipeline.node.downscale.desc=画像の解像度を 1/2 または 1/4 にします。
pipeline.node.upscale.desc=AI モデルで画像をアップスケールします（パイプライン外で実行）。
pipeline.node.regenerate_mipmaps.desc=画像の mipmap チェーンを再構築します。
pipeline.node.image_properties.desc=画像の幅、高さ、mip 数、種別、チャンネルのサブ種別を報告します。
pipeline.node.set_kind.desc=画像に意味的なテクスチャ種別を付与します。
pipeline.node.conditional.desc=2 つの数値の比較結果に基づき、値を真または偽の出力へ振り分けます。
pipeline.node.select.desc=2 つの数値の比較結果に基づき、2 つの値のいずれかを出力します（三項演算）。
pipeline.node.rendezvous.desc=2 つの分岐を合流させ、値を持つ方の入力を出力します。
pipeline.node.subpipeline.desc=保存済みの別のパイプラインをステップとして実行します。ピンはそのパイプラインのポートに対応します。
pipeline.node.local_call.desc=このグラフ内のローカルパイプラインフレームを実行します。ピンはそのフレームのポートに対応します。
pipeline.node.frame_local.desc=コンテナです。内部に配置したノードがこのグラフから呼び出し可能なローカルパイプラインを構成します。
pipeline.node.standard_output.desc=パイプラインのメイン出力画像（処理結果）。
pipeline.node.real_output.desc=名前付きの実数出力（関数パイプライン用）。
pipeline.node.integer_output.desc=名前付きの整数出力（関数パイプライン用）。
pipeline.node.channel_output.desc=名前付きの単一チャンネル出力（関数パイプライン用）。
pipeline.node.numeric_output.desc=名前付きの多態的な数値出力（関数パイプライン用）。
