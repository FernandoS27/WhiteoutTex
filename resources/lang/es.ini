# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=La imagen de entrada principal del pipeline (la textura sobre la que se ejecuta).
pipeline.node.real_input.desc=Un parámetro de número real proporcionado al ejecutar el pipeline (rango de límite opcional).
pipeline.node.integer_input.desc=Un parámetro entero proporcionado al ejecutar el pipeline (rango de límite opcional).
pipeline.node.channel_input.desc=Una entrada de un solo canal proporcionada cuando el pipeline se llama como función.
pipeline.node.numeric_input.desc=Una entrada numérica polimórfica (real, entero o canal) proporcionada en tiempo de ejecución.
pipeline.node.resource.desc=Carga una imagen predefinida incluida desde la carpeta de recursos.
pipeline.node.const_int.desc=Emite un valor entero fijo.
pipeline.node.const_real.desc=Emite un valor real (decimal) fijo.
pipeline.node.const_channel.desc=Genera un solo canal de un ancho y alto dados, relleno con un valor.
pipeline.node.const_kind.desc=Emite un tipo de textura elegido como un entero.
pipeline.node.extract_channel.desc=Extrae un canal (R, G, B o A) de una imagen.
pipeline.node.invert_channel.desc=Invierte el canal seleccionado de una imagen.
pipeline.node.fill_channel.desc=Establece el canal seleccionado de una imagen a un valor fijo.
pipeline.node.invert.desc=Invierte un solo canal (1 - valor).
pipeline.node.merge_channels.desc=Combina hasta cuatro canales individuales en una imagen RGBA.
pipeline.node.prims.desc=Expande un solo canal en una imagen RGBA en escala de grises.
pipeline.node.luma.desc=Calcula la luminancia (escala de grises) de una imagen usando la ponderación elegida.
pipeline.node.add.desc=Suma dos valores elemento a elemento (números o canales).
pipeline.node.multiply.desc=Multiplica dos valores elemento a elemento (números o canales).
pipeline.node.min.desc=Mínimo por elemento de dos valores.
pipeline.node.max.desc=Máximo por elemento de dos valores.
pipeline.node.negate.desc=Niega un valor (-x).
pipeline.node.sqrt.desc=Raíz cuadrada de un valor.
pipeline.node.reciprocal.desc=Recíproco de un valor (1 / x).
pipeline.node.bit_and.desc=AND a nivel de bits de dos enteros.
pipeline.node.bit_or.desc=OR a nivel de bits de dos enteros.
pipeline.node.bit_xor.desc=XOR a nivel de bits de dos enteros.
pipeline.node.bit_not.desc=NOT a nivel de bits (complemento) de un entero.
pipeline.node.bit_shl.desc=Desplaza los bits de un entero a la izquierda una cantidad dada.
pipeline.node.bit_shr.desc=Desplaza los bits de un entero a la derecha una cantidad dada.
pipeline.node.gaussian_blur.desc=Desenfoca una imagen con un núcleo Gaussian del radio dado.
pipeline.node.sharpen.desc=Enfoca una imagen con la intensidad dada.
pipeline.node.sobel.desc=Detección de bordes Sobel sobre un solo canal.
pipeline.node.derivatives.desc=Calcula los gradientes (derivadas) X e Y de un canal.
pipeline.node.blend.desc=Compone una capa superior sobre una capa inferior usando el modo de mezcla elegido.
pipeline.node.mirror.desc=Voltea una imagen o canal horizontalmente (X) o verticalmente (Y).
pipeline.node.rotate.desc=Rota una imagen o canal un número de grados.
pipeline.node.scale_to.desc=Remuestrea una imagen o canal a un ancho y alto exactos.
pipeline.node.scale_by.desc=Remuestrea una imagen o canal por un factor de escala (1.0 = sin cambios).
pipeline.node.matching_mipmap.desc=Encuentra el nivel de mip de una imagen que mejor coincide con otra.
pipeline.node.extract_mipmap.desc=Extrae un solo nivel de mip de una imagen.
pipeline.node.downscale.desc=Reduce la resolución de una imagen a la mitad o a un cuarto.
pipeline.node.upscale.desc=Aumenta la escala de una imagen con un modelo de IA (se ejecuta fuera del pipeline).
pipeline.node.regenerate_mipmaps.desc=Reconstruye la cadena de mipmaps de una imagen.
pipeline.node.image_properties.desc=Informa del ancho, alto, número de mips, tipo y subtipos de canal de una imagen.
pipeline.node.set_kind.desc=Etiqueta una imagen con un tipo de textura semántico.
pipeline.node.conditional.desc=Dirige un valor a su salida verdadera o falsa según la comparación de dos números.
pipeline.node.select.desc=Emite uno de dos valores según la comparación de dos números (un ternario).
pipeline.node.rendezvous.desc=Une dos ramas: emite la entrada que lleve un valor.
pipeline.node.subpipeline.desc=Ejecuta otro pipeline guardado como un paso; sus pines reflejan los puertos de ese pipeline.
pipeline.node.local_call.desc=Ejecuta un fotograma de Pipeline local de este grafo; sus pines reflejan los puertos del fotograma.
pipeline.node.frame_local.desc=Un contenedor; los nodos colocados dentro forman un pipeline local invocable desde este grafo.
pipeline.node.standard_output.desc=La imagen de salida principal del pipeline (el resultado).
pipeline.node.real_output.desc=Una salida de número real con nombre (para pipelines de función).
pipeline.node.integer_output.desc=Una salida entera con nombre (para pipelines de función).
pipeline.node.channel_output.desc=Una salida de un solo canal con nombre (para pipelines de función).
