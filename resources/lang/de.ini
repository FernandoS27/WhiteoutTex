# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=Das Haupteingabebild der Pipeline (die Textur, auf der sie ausgeführt wird).
pipeline.node.real_input.desc=Ein Reellzahl-Parameter, der beim Ausführen der Pipeline übergeben wird (optionaler Begrenzungsbereich).
pipeline.node.integer_input.desc=Ein Ganzzahl-Parameter, der beim Ausführen der Pipeline übergeben wird (optionaler Begrenzungsbereich).
pipeline.node.channel_input.desc=Eine Einzelkanal-Eingabe, die übergeben wird, wenn die Pipeline als Funktion aufgerufen wird.
pipeline.node.numeric_input.desc=Eine polymorphe numerische Eingabe (reell, ganzzahlig oder Kanal), die zur Laufzeit übergeben wird.
pipeline.node.resource.desc=Lädt ein mitgeliefertes voreingestelltes Bild aus dem Ordner resources.
pipeline.node.const_int.desc=Gibt einen festen Ganzzahlwert aus.
pipeline.node.const_real.desc=Gibt einen festen reellen (dezimalen) Wert aus.
pipeline.node.const_channel.desc=Erzeugt einen einzelnen Kanal mit gegebener Breite und Höhe, gefüllt mit einem Wert.
pipeline.node.const_kind.desc=Gibt eine gewählte Texturart als Ganzzahl aus.
pipeline.node.extract_channel.desc=Extrahiert einen Kanal (R, G, B oder A) aus einem Bild.
pipeline.node.invert_channel.desc=Invertiert den gewählten Kanal eines Bildes.
pipeline.node.fill_channel.desc=Setzt den gewählten Kanal eines Bildes auf einen festen Wert.
pipeline.node.invert.desc=Invertiert einen einzelnen Kanal (1 - Wert).
pipeline.node.merge_channels.desc=Kombiniert bis zu vier einzelne Kanäle zu einem RGBA-Bild.
pipeline.node.prims.desc=Erweitert einen einzelnen Kanal zu einem Graustufen-RGBA-Bild.
pipeline.node.luma.desc=Berechnet die Luminanz (Graustufen) eines Bildes mit der gewählten Gewichtung.
pipeline.node.add.desc=Addiert zwei Werte elementweise (Zahlen oder Kanäle).
pipeline.node.multiply.desc=Multipliziert zwei Werte elementweise (Zahlen oder Kanäle).
pipeline.node.min.desc=Elementweises Minimum zweier Werte.
pipeline.node.max.desc=Elementweises Maximum zweier Werte.
pipeline.node.negate.desc=Negiert einen Wert (-x).
pipeline.node.sqrt.desc=Quadratwurzel eines Wertes.
pipeline.node.reciprocal.desc=Kehrwert eines Wertes (1 / x).
pipeline.node.power.desc=Potenziert eine Basis mit einem Exponenten (Basis ^ Exponent).
pipeline.node.to_int.desc=Konvertiert eine Realzahl mithilfe des gewählten Rundungsmodus in eine Ganzzahl.
pipeline.node.to_real.desc=Konvertiert eine Ganzzahl in eine Realzahl.
pipeline.node.sine.desc=Sinus eines Wertes im Bogenmaß (elementweise für einen Kanal).
pipeline.node.cosine.desc=Kosinus eines Wertes im Bogenmaß (elementweise für einen Kanal).
pipeline.node.ln.desc=Natürlicher Logarithmus (Basis e); nicht-positive Werte ergeben 0.
pipeline.node.bit_and.desc=Bitweises UND zweier Ganzzahlen.
pipeline.node.bit_or.desc=Bitweises ODER zweier Ganzzahlen.
pipeline.node.bit_xor.desc=Bitweises XOR zweier Ganzzahlen.
pipeline.node.bit_not.desc=Bitweises NICHT (Komplement) einer Ganzzahl.
pipeline.node.bit_shl.desc=Verschiebt die Bits einer Ganzzahl um einen Betrag nach links.
pipeline.node.bit_shr.desc=Verschiebt die Bits einer Ganzzahl um einen Betrag nach rechts.
pipeline.node.gaussian_blur.desc=Zeichnet ein Bild mit einem Gaussian-Kernel des gegebenen Radius weich.
pipeline.node.sharpen.desc=Schärft ein Bild mit der gegebenen Stärke.
pipeline.node.sobel.desc=Sobel-Kantenerkennung auf einem einzelnen Kanal.
pipeline.node.derivatives.desc=Berechnet die X- und Y-Gradienten (Ableitungen) eines Kanals.
pipeline.node.blend.desc=Setzt eine obere Ebene über eine untere Ebene mit dem gewählten Überblendmodus zusammen.
pipeline.node.mirror.desc=Spiegelt ein Bild oder einen Kanal horizontal (X) oder vertikal (Y).
pipeline.node.rotate.desc=Dreht ein Bild oder einen Kanal um eine Anzahl von Grad.
pipeline.node.scale_to.desc=Skaliert ein Bild oder einen Kanal auf eine exakte Breite und Höhe neu.
pipeline.node.scale_by.desc=Skaliert ein Bild oder einen Kanal um einen Skalierungsfaktor neu (1.0 = unverändert).
pipeline.node.displace.desc=Verschiebt ein Bild oder einen Kanal um X- und Y-Versätze; Ränder werden umbrochen, festgeklemmt oder geleert.
pipeline.node.resize_canvas.desc=Ändert die Leinwandgröße und hält die Quelle zentriert (füllt auf oder schneidet zu, kein Resampling).
pipeline.node.tiling.desc=Macht ein Bild oder einen Kanal nahtlos kachelbar, indem die Ränder überblendet werden.
pipeline.node.matching_mipmap.desc=Findet die Mip-Stufe eines Bildes, die einem anderen am besten entspricht.
pipeline.node.extract_mipmap.desc=Extrahiert eine einzelne Mip-Stufe aus einem Bild.
