# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=The pipeline's main input image (the texture it is run on).
pipeline.node.real_input.desc=A real-number parameter supplied when the pipeline runs (optional clamp range).
pipeline.node.integer_input.desc=An integer parameter supplied when the pipeline runs (optional clamp range).
pipeline.node.channel_input.desc=A single-channel input supplied when the pipeline is called as a function.
pipeline.node.numeric_input.desc=A polymorphic numeric input (real, integer, or channel) supplied at run time.
pipeline.node.resource.desc=Loads a bundled preset image from the resources folder.
pipeline.node.const_int.desc=Outputs a fixed integer value.
pipeline.node.const_real.desc=Outputs a fixed real (decimal) value.
pipeline.node.const_channel.desc=Generates a single channel of a given width and height filled with a value.
pipeline.node.const_kind.desc=Outputs a chosen texture kind as an integer.
pipeline.node.extract_channel.desc=Extracts one channel (R, G, B, or A) from an image.
pipeline.node.invert_channel.desc=Inverts the selected channel of an image.
pipeline.node.fill_channel.desc=Sets the selected channel of an image to a fixed value.
pipeline.node.invert.desc=Inverts a single channel (1 - value).
pipeline.node.merge_channels.desc=Combines up to four single channels into an RGBA image.
pipeline.node.prims.desc=Expands a single channel into a grayscale RGBA image.
pipeline.node.luma.desc=Computes luminance (grayscale) from an image using the chosen weighting.
pipeline.node.add.desc=Adds two values element-wise (numbers or channels).
pipeline.node.multiply.desc=Multiplies two values element-wise (numbers or channels).
pipeline.node.min.desc=Per-element minimum of two values.
pipeline.node.max.desc=Per-element maximum of two values.
pipeline.node.negate.desc=Negates a value (-x).
pipeline.node.sqrt.desc=Square root of a value.
pipeline.node.reciprocal.desc=Reciprocal of a value (1 / x).
pipeline.node.power.desc=Raises a base to an exponent (base ^ exponent).
pipeline.node.sine.desc=Sine of a value in radians (per element for a channel).
pipeline.node.cosine.desc=Cosine of a value in radians (per element for a channel).
pipeline.node.ln.desc=Natural logarithm (base e); non-positive values yield 0.
pipeline.node.bit_and.desc=Bitwise AND of two integers.
pipeline.node.bit_or.desc=Bitwise OR of two integers.
pipeline.node.bit_xor.desc=Bitwise XOR of two integers.
pipeline.node.bit_not.desc=Bitwise NOT (complement) of an integer.
pipeline.node.bit_shl.desc=Shifts an integer's bits left by an amount.
pipeline.node.bit_shr.desc=Shifts an integer's bits right by an amount.
pipeline.node.gaussian_blur.desc=Blurs an image with a Gaussian kernel of the given radius.
pipeline.node.sharpen.desc=Sharpens an image by the given strength.
pipeline.node.sobel.desc=Sobel edge detection on a single channel.
pipeline.node.derivatives.desc=Computes the X and Y gradients (derivatives) of a channel.
pipeline.node.blend.desc=Composites a top layer over a bottom layer using the chosen blend mode.
pipeline.node.mirror.desc=Flips an image or channel horizontally (X) or vertically (Y).
pipeline.node.rotate.desc=Rotates an image or channel by a number of degrees.
pipeline.node.scale_to.desc=Resamples an image or channel to an exact width and height.
pipeline.node.scale_by.desc=Resamples an image or channel by a scale factor (1.0 = unchanged).
pipeline.node.displace.desc=Shifts an image or channel by X and Y offsets; edges wrap, clamp or clear.
pipeline.node.resize_canvas.desc=Changes the canvas size, keeping the source centered (pads or crops, no resampling).
pipeline.node.tiling.desc=Makes an image or channel seamlessly tileable by blending its borders.
pipeline.node.matching_mipmap.desc=Finds the mip level of one image that best matches another.
pipeline.node.extract_mipmap.desc=Extracts a single mip level from an image.
pipeline.node.downscale.desc=Halves or quarters an image's resolution.
pipeline.node.upscale.desc=Upscales an image with an AI model (run outside the pipeline).
pipeline.node.regenerate_mipmaps.desc=Rebuilds an image's mipmap chain.
pipeline.node.image_properties.desc=Reports an image's width, height, mip count, kind, and channel subkinds.
pipeline.node.set_kind.desc=Tags an image with a semantic texture kind.
pipeline.node.conditional.desc=Routes a value to its true or false output based on comparing two numbers.
pipeline.node.select.desc=Outputs one of two values based on comparing two numbers (a ternary).
pipeline.node.rendezvous.desc=Joins two branches: outputs whichever input carries a value.
pipeline.node.subpipeline.desc=Runs another saved pipeline as a step; its pins mirror that pipeline's ports.
pipeline.node.local_call.desc=Runs a Local Pipeline frame from this graph; its pins mirror the frame's ports.
pipeline.node.frame_local.desc=A container; nodes placed inside it form a local pipeline callable from this graph.
pipeline.node.standard_output.desc=The pipeline's main output image (the result).
pipeline.node.real_output.desc=A named real-number output (for function pipelines).
pipeline.node.integer_output.desc=A named integer output (for function pipelines).
pipeline.node.channel_output.desc=A named single-channel output (for function pipelines).
pipeline.node.numeric_output.desc=A named polymorphic numeric output (for function pipelines).
