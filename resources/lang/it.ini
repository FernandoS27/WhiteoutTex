# WhiteoutTex UI translation catalog — Italian (Italiano)
#
# Format: key=value, UTF-8, no BOM. One string per line.
# Translation rules for the other language files (es/de/fr/zh):
#   * Translate ONLY the value (right of '='); keep the key (left of '=') verbatim.
#   * Preserve every printf specifier exactly: %s %d %u %zu %llu %.0f%% etc.
#   * Preserve any "##id" suffix in a value verbatim (it is an ImGui widget id,
#     not visible text) — e.g. "Browse##input" -> "Sfoglia##input".
#   * "\n" in a value becomes a line break; keep them where present.
#   * Technical tokens stay in English (format codes like BC1, product names).

