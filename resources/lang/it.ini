# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=L'immagine di ingresso principale della pipeline (la texture su cui viene eseguita).
pipeline.node.real_input.desc=Un parametro numerico reale fornito all'esecuzione della pipeline (intervallo di limitazione opzionale).
pipeline.node.integer_input.desc=Un parametro intero fornito all'esecuzione della pipeline (intervallo di limitazione opzionale).
pipeline.node.channel_input.desc=Un ingresso a canale singolo fornito quando la pipeline viene chiamata come funzione.
pipeline.node.numeric_input.desc=Un ingresso numerico polimorfico (reale, intero o canale) fornito all'esecuzione.
pipeline.node.resource.desc=Carica un'immagine preimpostata inclusa dalla cartella resources.
pipeline.node.const_int.desc=Restituisce un valore intero fisso.
pipeline.node.const_real.desc=Restituisce un valore reale (decimale) fisso.
pipeline.node.const_channel.desc=Genera un singolo canale di una data larghezza e altezza riempito con un valore.
pipeline.node.const_kind.desc=Restituisce una tipologia di texture scelta come intero.
pipeline.node.extract_channel.desc=Estrae un canale (R, G, B o A) da un'immagine.
pipeline.node.invert_channel.desc=Inverte il canale selezionato di un'immagine.
pipeline.node.fill_channel.desc=Imposta il canale selezionato di un'immagine a un valore fisso.
pipeline.node.invert.desc=Inverte un singolo canale (1 - valore).
pipeline.node.merge_channels.desc=Combina fino a quattro canali singoli in un'immagine RGBA.
pipeline.node.prims.desc=Espande un singolo canale in un'immagine RGBA in scala di grigi.
pipeline.node.luma.desc=Calcola la luminanza (scala di grigi) di un'immagine usando la ponderazione scelta.
pipeline.node.add.desc=Somma due valori elemento per elemento (numeri o canali).
pipeline.node.multiply.desc=Moltiplica due valori elemento per elemento (numeri o canali).
pipeline.node.min.desc=Minimo elemento per elemento di due valori.
pipeline.node.max.desc=Massimo elemento per elemento di due valori.
pipeline.node.negate.desc=Nega un valore (-x).
pipeline.node.sqrt.desc=Radice quadrata di un valore.
pipeline.node.reciprocal.desc=Reciproco di un valore (1 / x).
pipeline.node.power.desc=Eleva una base a un esponente (base ^ esponente).
pipeline.node.to_int.desc=Converte un reale in un intero usando la modalità di arrotondamento scelta.
pipeline.node.to_real.desc=Converte un intero in un reale.
pipeline.node.sine.desc=Seno di un valore in radianti (per elemento per un canale).
pipeline.node.cosine.desc=Coseno di un valore in radianti (per elemento per un canale).
pipeline.node.ln.desc=Logaritmo naturale (base e); i valori non positivi danno 0.
pipeline.node.bit_and.desc=AND bit a bit di due interi.
pipeline.node.bit_or.desc=OR bit a bit di due interi.
pipeline.node.bit_xor.desc=XOR bit a bit di due interi.
pipeline.node.bit_not.desc=NOT bit a bit (complemento) di un intero.
pipeline.node.bit_shl.desc=Scorre i bit di un intero a sinistra di una quantità.
pipeline.node.bit_shr.desc=Scorre i bit di un intero a destra di una quantità.
pipeline.node.gaussian_blur.desc=Sfoca un'immagine con un kernel Gaussian del raggio indicato.
pipeline.node.sharpen.desc=Aumenta la nitidezza di un'immagine dell'intensità indicata.
pipeline.node.sobel.desc=Rilevamento dei bordi Sobel su un singolo canale.
pipeline.node.derivatives.desc=Calcola i gradienti (derivate) X e Y di un canale.
pipeline.node.blend.desc=Compone un livello superiore su un livello inferiore usando la modalità di fusione scelta.
pipeline.node.mirror.desc=Capovolge un'immagine o un canale orizzontalmente (X) o verticalmente (Y).
pipeline.node.rotate.desc=Ruota un'immagine o un canale di un numero di gradi.
pipeline.node.scale_to.desc=Ricampiona un'immagine o un canale a una larghezza e altezza esatte.
pipeline.node.scale_by.desc=Ricampiona un'immagine o un canale di un fattore di scala (1.0 = invariato).
pipeline.node.displace.desc=Sposta un'immagine o un canale di offset X e Y; i bordi si avvolgono, si bloccano o si svuotano.
pipeline.node.resize_canvas.desc=Modifica le dimensioni della tela, mantenendo la sorgente centrata (aggiunge margini o ritaglia, senza ricampionamento).
pipeline.node.tiling.desc=Rende un'immagine o un canale affiancabile senza giunzioni fondendone i bordi.
pipeline.node.matching_mipmap.desc=Trova il livello mip di un'immagine che meglio corrisponde a un'altra.
pipeline.node.extract_mipmap.desc=Estrae un singolo livello mip da un'immagine.
pipeline.node.downscale.desc=Dimezza o riduce a un quarto la risoluzione di un'immagine.
pipeline.node.upscale.desc=Ingrandisce un'immagine con un modello AI (eseguito al di fuori della pipeline).
pipeline.node.regenerate_mipmaps.desc=Ricostruisce la catena di mipmap di un'immagine.
pipeline.node.image_properties.desc=Riporta larghezza, altezza, numero di mip, tipologia e sottotipologie dei canali di un'immagine.
