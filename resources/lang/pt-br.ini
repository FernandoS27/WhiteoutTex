# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=A imagem de entrada principal do pipeline (a textura sobre a qual ele é executado).
pipeline.node.real_input.desc=Um parâmetro de número real fornecido quando o pipeline é executado (intervalo de limitação opcional).
pipeline.node.integer_input.desc=Um parâmetro inteiro fornecido quando o pipeline é executado (intervalo de limitação opcional).
pipeline.node.channel_input.desc=Uma entrada de canal único fornecida quando o pipeline é chamado como função.
pipeline.node.numeric_input.desc=Uma entrada numérica polimórfica (real, inteiro ou canal) fornecida em tempo de execução.
pipeline.node.resource.desc=Carrega uma imagem predefinida incluída na pasta de recursos.
pipeline.node.const_int.desc=Gera um valor inteiro fixo.
pipeline.node.const_real.desc=Gera um valor real (decimal) fixo.
pipeline.node.const_channel.desc=Gera um canal único com a largura e a altura especificadas, preenchido com um valor.
pipeline.node.const_kind.desc=Gera um tipo de textura escolhido como um inteiro.
pipeline.node.extract_channel.desc=Extrai um canal (R, G, B ou A) de uma imagem.
pipeline.node.invert_channel.desc=Inverte o canal selecionado de uma imagem.
pipeline.node.fill_channel.desc=Define o canal selecionado de uma imagem com um valor fixo.
pipeline.node.invert.desc=Inverte um canal único (1 - valor).
pipeline.node.merge_channels.desc=Combina até quatro canais únicos em uma imagem RGBA.
pipeline.node.prims.desc=Expande um canal único em uma imagem RGBA em tons de cinza.
pipeline.node.luma.desc=Calcula a luminância (tons de cinza) de uma imagem usando a ponderação escolhida.
pipeline.node.add.desc=Soma dois valores elemento a elemento (números ou canais).
pipeline.node.multiply.desc=Multiplica dois valores elemento a elemento (números ou canais).
pipeline.node.min.desc=Mínimo elemento a elemento de dois valores.
pipeline.node.max.desc=Máximo elemento a elemento de dois valores.
pipeline.node.negate.desc=Nega um valor (-x).
pipeline.node.sqrt.desc=Raiz quadrada de um valor.
pipeline.node.reciprocal.desc=Recíproco de um valor (1 / x).
pipeline.node.power.desc=Eleva uma base a um expoente (base ^ expoente).
pipeline.node.to_int.desc=Converte um Real em um Inteiro usando o modo de arredondamento escolhido.
pipeline.node.to_real.desc=Converte um Inteiro em um Real.
pipeline.node.sine.desc=Seno de um valor em radianos (elemento a elemento em um canal).
pipeline.node.cosine.desc=Cosseno de um valor em radianos (elemento a elemento em um canal).
pipeline.node.ln.desc=Logaritmo natural (base e); valores não positivos resultam em 0.
pipeline.node.bit_and.desc=AND bit a bit de dois inteiros.
pipeline.node.bit_or.desc=OR bit a bit de dois inteiros.
pipeline.node.bit_xor.desc=XOR bit a bit de dois inteiros.
pipeline.node.bit_not.desc=NOT bit a bit (complemento) de um inteiro.
pipeline.node.bit_shl.desc=Desloca os bits de um inteiro para a esquerda em uma quantidade.
pipeline.node.bit_shr.desc=Desloca os bits de um inteiro para a direita em uma quantidade.
pipeline.node.gaussian_blur.desc=Desfoca uma imagem com um kernel gaussiano do raio especificado.
pipeline.node.sharpen.desc=Aumenta a nitidez de uma imagem pela intensidade especificada.
pipeline.node.sobel.desc=Detecção de bordas Sobel em um canal único.
pipeline.node.derivatives.desc=Calcula os gradientes X e Y (derivadas) de um canal.
pipeline.node.blend.desc=Compõe uma camada superior sobre uma camada inferior usando o modo de mesclagem escolhido.
pipeline.node.mirror.desc=Espelha uma imagem ou canal horizontalmente (X) ou verticalmente (Y).
pipeline.node.rotate.desc=Gira uma imagem ou canal por um número de graus.
pipeline.node.scale_to.desc=Reamostra uma imagem ou canal para uma largura e altura exatas.
pipeline.node.scale_by.desc=Reamostra uma imagem ou canal por um fator de escala (1.0 = sem alteração).
pipeline.node.displace.desc=Desloca uma imagem ou canal por deslocamentos em X e Y; as bordas se repetem, fixam ou ficam transparentes.
pipeline.node.resize_canvas.desc=Altera o tamanho da tela, mantendo o conteúdo original centralizado (preenche ou recorta, sem reamostragem).
pipeline.node.tiling.desc=Torna uma imagem ou canal repetível sem emendas mesclando suas bordas.
pipeline.node.matching_mipmap.desc=Encontra o nível de mip de uma imagem que melhor corresponde a outra.
pipeline.node.extract_mipmap.desc=Extrai um único nível de mip de uma imagem.
pipeline.node.downscale.desc=Reduz a resolução de uma imagem à metade ou a um quarto.
pipeline.node.upscale.desc=Amplia uma imagem com um modelo de IA (executado fora do pipeline).
pipeline.node.regenerate_mipmaps.desc=Reconstrói a cadeia de mipmaps de uma imagem.
