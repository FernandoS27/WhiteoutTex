# ── Pipeline node descriptions (hover tooltips) ──────────────────────────
pipeline.node.standard_input.desc=파이프라인의 주 입력 이미지(실행 대상 텍스처)입니다.
pipeline.node.real_input.desc=파이프라인 실행 시 제공되는 실수 매개변수입니다(선택적 범위 제한).
pipeline.node.integer_input.desc=파이프라인 실행 시 제공되는 정수 매개변수입니다(선택적 범위 제한).
pipeline.node.channel_input.desc=파이프라인을 함수로 호출할 때 제공되는 단일 채널 입력입니다.
pipeline.node.numeric_input.desc=실행 시 제공되는 다형성 숫자 입력(실수, 정수 또는 채널)입니다.
pipeline.node.resource.desc=resources 폴더에서 번들된 프리셋 이미지를 불러옵니다.
pipeline.node.const_int.desc=고정된 정수 값을 출력합니다.
pipeline.node.const_real.desc=고정된 실수(소수) 값을 출력합니다.
pipeline.node.const_channel.desc=지정한 너비와 높이의 단일 채널을 값으로 채워 생성합니다.
pipeline.node.const_kind.desc=선택한 텍스처 종류를 정수로 출력합니다.
pipeline.node.extract_channel.desc=이미지에서 한 채널(R, G, B 또는 A)을 추출합니다.
pipeline.node.invert_channel.desc=이미지의 선택한 채널을 반전합니다.
pipeline.node.fill_channel.desc=이미지의 선택한 채널을 고정 값으로 설정합니다.
pipeline.node.invert.desc=단일 채널을 반전합니다(1 - 값).
pipeline.node.merge_channels.desc=최대 4개의 단일 채널을 RGBA 이미지로 결합합니다.
pipeline.node.prims.desc=단일 채널을 회색조 RGBA 이미지로 확장합니다.
pipeline.node.luma.desc=선택한 가중치를 사용해 이미지에서 휘도(회색조)를 계산합니다.
pipeline.node.add.desc=두 값을 요소별로 더합니다(숫자 또는 채널).
pipeline.node.multiply.desc=두 값을 요소별로 곱합니다(숫자 또는 채널).
pipeline.node.min.desc=두 값의 요소별 최솟값입니다.
pipeline.node.max.desc=두 값의 요소별 최댓값입니다.
pipeline.node.negate.desc=값의 부호를 반전합니다(-x).
pipeline.node.sqrt.desc=값의 제곱근입니다.
pipeline.node.reciprocal.desc=값의 역수입니다(1 / x).
pipeline.node.power.desc=밑을 지수만큼 거듭제곱합니다(밑 ^ 지수).
pipeline.node.to_int.desc=선택한 반올림 모드를 사용하여 실수를 정수로 변환합니다.
pipeline.node.to_real.desc=정수를 실수로 변환합니다.
pipeline.node.sine.desc=라디안 단위 값의 사인입니다(채널의 경우 요소별).
pipeline.node.cosine.desc=라디안 단위 값의 코사인입니다(채널의 경우 요소별).
pipeline.node.ln.desc=자연 로그(밑 e)입니다. 0 이하의 값은 0이 됩니다.
pipeline.node.bit_and.desc=두 정수의 비트 AND입니다.
pipeline.node.bit_or.desc=두 정수의 비트 OR입니다.
pipeline.node.bit_xor.desc=두 정수의 비트 XOR입니다.
pipeline.node.bit_not.desc=정수의 비트 NOT(보수)입니다.
pipeline.node.bit_shl.desc=정수의 비트를 지정한 만큼 왼쪽으로 시프트합니다.
pipeline.node.bit_shr.desc=정수의 비트를 지정한 만큼 오른쪽으로 시프트합니다.
pipeline.node.gaussian_blur.desc=지정한 반경의 Gaussian 커널로 이미지를 흐리게 합니다.
pipeline.node.sharpen.desc=지정한 강도로 이미지를 선명하게 합니다.
pipeline.node.sobel.desc=단일 채널에 대한 Sobel 에지 검출입니다.
pipeline.node.derivatives.desc=채널의 X 및 Y 기울기(미분)를 계산합니다.
pipeline.node.blend.desc=선택한 블렌드 모드로 위 레이어를 아래 레이어 위에 합성합니다.
pipeline.node.mirror.desc=이미지나 채널을 가로(X) 또는 세로(Y)로 뒤집습니다.
pipeline.node.rotate.desc=이미지나 채널을 지정한 각도만큼 회전합니다.
pipeline.node.scale_to.desc=이미지나 채널을 정확한 너비와 높이로 리샘플링합니다.
pipeline.node.scale_by.desc=이미지나 채널을 배율로 리샘플링합니다(1.0 = 변경 없음).
pipeline.node.displace.desc=이미지나 채널을 X 및 Y 오프셋만큼 이동합니다. 가장자리는 감싸기, 고정 또는 비우기로 처리됩니다.
pipeline.node.resize_canvas.desc=원본을 가운데에 유지한 채 캔버스 크기를 변경합니다(리샘플링 없이 채우거나 자릅니다).
pipeline.node.tiling.desc=가장자리를 블렌딩하여 이미지나 채널을 이음매 없이 타일링할 수 있게 만듭니다.
pipeline.node.matching_mipmap.desc=한 이미지에서 다른 이미지와 가장 잘 맞는 mip 레벨을 찾습니다.
pipeline.node.extract_mipmap.desc=이미지에서 단일 mip 레벨을 추출합니다.
pipeline.node.downscale.desc=이미지 해상도를 1/2 또는 1/4로 줄입니다.
pipeline.node.upscale.desc=AI 모델로 이미지를 업스케일합니다(파이프라인 외부에서 실행).
pipeline.node.regenerate_mipmaps.desc=이미지의 mipmap 체인을 다시 생성합니다.
pipeline.node.image_properties.desc=이미지의 너비, 높이, mip 개수, 종류 및 채널 하위 종류를 보고합니다.
pipeline.node.set_kind.desc=이미지에 의미론적 텍스처 종류를 태그합니다.
pipeline.node.conditional.desc=두 숫자를 비교한 결과에 따라 값을 참 또는 거짓 출력으로 전달합니다.
pipeline.node.select.desc=두 숫자를 비교해 두 값 중 하나를 출력합니다(삼항 연산).
pipeline.node.rendezvous.desc=두 분기를 합칩니다: 값을 가진 입력을 출력합니다.
pipeline.node.subpipeline.desc=저장된 다른 파이프라인을 한 단계로 실행합니다. 핀은 해당 파이프라인의 포트를 반영합니다.
pipeline.node.local_call.desc=이 그래프에서 로컬 파이프라인 프레임을 실행합니다. 핀은 프레임의 포트를 반영합니다.
pipeline.node.frame_local.desc=컨테이너입니다. 내부에 배치한 노드가 이 그래프에서 호출 가능한 로컬 파이프라인을 구성합니다.
pipeline.node.standard_output.desc=파이프라인의 주 출력 이미지(결과)입니다.
pipeline.node.real_output.desc=이름이 지정된 실수 출력입니다(함수 파이프라인용).
pipeline.node.integer_output.desc=이름이 지정된 정수 출력입니다(함수 파이프라인용).
pipeline.node.channel_output.desc=이름이 지정된 단일 채널 출력입니다(함수 파이프라인용).
pipeline.node.numeric_output.desc=이름이 지정된 다형성 숫자 출력입니다(함수 파이프라인용).
