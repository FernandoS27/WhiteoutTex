# WhiteoutTex UI 번역 카탈로그 — 한국어 (Korean)
#
# 형식: key=value, UTF-8, BOM 없음. 한 줄에 하나의 문자열.
# 번역 규칙:
#   * 값(= 오른쪽)만 번역하고, 키(= 왼쪽)는 그대로 유지합니다.
#   * 모든 printf 지정자를 정확히 보존합니다: %s %d %u %zu %llu %.0f%% 등.
#   * 값에 있는 "##id" 접미사는 그대로 보존합니다 (ImGui 위젯 id).
#   * 값의 "\n"은 줄바꿈입니다. 있는 곳에 그대로 둡니다.
#   * 기술 용어(BC1 같은 형식 코드, 제품명)는 영어로 유지합니다.

